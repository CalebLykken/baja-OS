name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Qt needs a few system libraries even with the offscreen platform.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0
      - run: pip install -r requirements.txt pyflakes
      # Test modules turn ImportError into SkipTest, so a missing Qt module
      # would otherwise go green having run little.
      - name: Check Qt modules import
        run: python -c "import PyQt6.QtMultimedia, PyQt6.QtQml, PyQt6.QtGui, PyQt6.QtWebSockets"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Unit tests
        run: python -m unittest discover tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Lint
        run: python -m pyflakes backend main.py tests
        continue-on-error: true
