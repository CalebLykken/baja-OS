# WirePlumber: make the sound board (the InnoMaker HiFi DAC HAT, which the
# Pi knows as "BossDAC") the output of choice over HDMI, and give it a
# plain name. Installed by deploy/setup-pi.sh into
# ~/.config/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "BossDAC", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        node.description = "Sound board"
        priority.driver  = 2000
        priority.session = 2000
      }
    }
  }
]
