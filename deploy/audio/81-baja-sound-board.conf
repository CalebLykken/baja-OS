# WirePlumber: make the sound board (the InnoMaker HiFi DAC HAT, which the
# Pi knows as "BossDAC") the output of choice over HDMI, give it a plain
# name, and keep it running when nothing plays: switching it off a few
# seconds after a pause and back on at play made a pop. Installed by
# deploy/setup-pi.sh into ~/.config/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "BossDAC", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        node.description = "Sound board"
        priority.driver  = 2000
        priority.session = 2000
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
