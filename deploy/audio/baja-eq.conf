# Baja OS equalizer: a 5-band EQ in front of the speakers, run as its own
# small PipeWire process (baja-eq.service) so the main audio server never
# has to restart for it. WirePlumber's "smart filter" routing sends every
# stream for the default output (Spotify, the phone, local files) through it,
# and if it stops, audio simply goes straight to the output again.
#
# The dashboard changes the band gains live (backend/eq.py); the gains here
# are only the flat starting point.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Baja OS equalizer"
            media.name       = "Baja OS equalizer"
            filter.graph = {
                nodes = [
                    # Overall level, lowered when bands are boosted so the
                    # sum never clips. A high shelf at 0 Hz is a plain gain.
                    { type = builtin name = pre  label = bq_highshelf control = { "Freq" = 0.0     "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = bass label = bq_lowshelf  control = { "Freq" = 80.0    "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = low  label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = mid  label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = high label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = treb label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "pre:Out"  input = "bass:In" }
                    { output = "bass:Out" input = "low:In" }
                    { output = "low:Out"  input = "mid:In" }
                    { output = "mid:Out"  input = "high:In" }
                    { output = "high:Out" input = "treb:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "baja_eq"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "baja-eq"
            }
            playback.props = {
                node.name    = "baja_eq.output"
                node.passive = true
                stream.dont-remix = true
            }
        }
    }
]
