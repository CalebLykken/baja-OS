# WirePlumber: receive phone audio over Bluetooth (A2DP sink) and play it
# on the default output. Installed by deploy/setup-pi.sh into
# ~/.config/wireplumber/wireplumber.conf.d/.
#
# WirePlumber normally only runs Bluetooth for a logged-in seat session;
# Baja OS's audio session has no seat (it starts at boot with nobody
# logged in), so turn that check off.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# Act as a car-stereo style receiver only: no headset/call profiles, so the
# phone keeps calls on itself.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}
