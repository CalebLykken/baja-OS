# Baja OS clock: internet NTP when there is any, the GPS when there isn't.
# Installed to /etc/chrony/conf.d/ by deploy/setup-pi.sh. The internet
# sources and Debian's `makestep 1 3` come from Debian's own chrony.conf and
# are left alone: the 3 counts clock updates, not time, so a first source that
# arrives late (the hotspot, a fix) still steps a wrong boot clock.

# gpsd publishes the receiver's NMEA time in shared memory segment 0; chrony
# reads it from there (gpsd must be the one reading the receiver). The u-blox
# is on USB, so there is no PPS pulse and the time is only good to about
# 100 ms, plenty for a clock and a day/night switch. precision is that 100 ms;
# delay is the guessed lag between the second and the sentence arriving;
# offset is for trimming after measuring against the internet (chronyc
# sourcestats), 0.0 until then. No `trust`: a lone source is selected anyway,
# and with the internet up a bad GPS time must not outvote the NTP pool.
refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2

# Copy the system time to the Pi 5's RTC every 11 minutes, so with a battery
# fitted the clock is already right at the next boot. Debian's chrony.conf has
# this line too; it is kept here deliberately, so the clock keeps syncing the
# RTC (and NTPSynchronized in setup-pi.sh's note holds) if that file changes.
rtcsync
