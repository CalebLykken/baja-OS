<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baja OS map</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1b1d; }
  /* The dashboard draws its own keys and attribution over the map. */
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display: none; }
  /* A picked place: a red pin, like Apple Maps. */
  .pin { width: 44px; height: 56px; filter: drop-shadow(0 3px 2px var(--shadow, rgba(0, 0, 0, 0.5))); }
  .pin path { fill: var(--pin, #ff3b30); stroke: var(--pin-edge, #ffffff); stroke-width: 1.2; }
  .pin circle { fill: var(--pin-edge, #ffffff); }
  /* The pin drops in and settles with one small bounce. MapLibre sets the
     transform on .pin itself, so the animation goes on the svg inside it. */
  @keyframes pin-drop {
    0% { transform: translateY(-60px); opacity: 0; }
    60% { transform: translateY(0) scaleY(0.92); opacity: 1; }
    78% { transform: translateY(-8px) scaleY(1); }
    100% { transform: translateY(0) scaleY(1); }
  }
  .pin.dropping svg { animation: pin-drop 420ms cubic-bezier(.3, .7, .4, 1) both; transform-origin: 50% 100%; }
  @media (prefers-reduced-motion: reduce) { .pin.dropping svg { animation: none; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="map.js"></script>
</head>
<body><div id="map"></div></body>
</html>
